<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>НЕПОГРЕШИМОСТЬ</title>
    <style>
        body { background: #0a0a0c; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { border: 1px solid #ff3333; padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; background: #121216; box-shadow: 0 0 25px rgba(255, 51, 51, 0.2); }
        h2 { text-align: center; color: #ff3333; margin-top: 0; letter-spacing: 3px; font-weight: 900; }
        .toggle { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; padding: 12px; background: #1c1c22; border-radius: 8px; }
        .switch { width: 46px; height: 24px; background: #444; border-radius: 24px; position: relative; cursor: pointer; transition: 0.3s; }
        .switch.active { background: #ff3333; }
        .switch::after { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .switch.active::after { left: 24px; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>НЕПОГРЕШИМОСТЬ</h2>
        <div class="toggle">
            <span>Aimbot</span>
            <div class="switch active" onclick="this.classList.toggle('active')"></div>
        </div>
        <div class="toggle">
            <span>Wallhack (ESP)</span>
            <div class="switch active" onclick="this.classList.toggle('active')"></div>
        </div>
        <div class="toggle">
            <span>Triggerbot</span>
            <div class="switch" onclick="this.classList.toggle('active')"></div>
        </div>
    </div>
</body>
</html>
